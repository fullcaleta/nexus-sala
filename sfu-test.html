<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>NEXUS — Prueba de SFU (no es la app real)</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; padding: 16px; }
    h1 { font-size: 1.1rem; }
    #log { white-space: pre-wrap; background: #000; padding: 10px; border-radius: 6px; max-height: 200px; overflow-y: auto; font-size: 0.8rem; }
    #videos { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .tile { width: 240px; }
    .tile video { width: 100%; background: #000; border-radius: 6px; }
    .tile p { margin: 4px 0; font-size: 0.8rem; }
    button { margin-right: 8px; }
  </style>
</head>
<body>
  <h1>Prueba de SFU — página aparte, NO es la app real</h1>
  <p>
    Nombre: <input id="name" value="Prueba" />
    Clave de moderador (opcional, para probar streams "solo mod"):
    <input id="mod" placeholder="" />
    <button id="join">Entrar</button>
    <button id="cam">Prender cámara+mic</button>
    <button id="mute-mic">Silenciar/activar mic</button>
    <button id="mute-cam">Silenciar/activar cámara</button>
    <button id="mod-camera">Mandar cámara "extra" (modCamera)</button>
  </p>
  <div id="log"></div>
  <div id="videos"></div>

  <script type="module">
    import { connect, on } from "./js/realtime.js?v=6";
    import { createSfuManager } from "./js/sfu.js";

    const logEl = document.getElementById("log");
    function log(...args) {
      console.log(...args);
      logEl.textContent += args.map((a) => (typeof a === "string" ? a : JSON.stringify(a))).join(" ") + "\n";
      logEl.scrollTop = logEl.scrollHeight;
    }

    let userId = "test-" + Math.random().toString(36).slice(2, 8);
    let sfu = null;

    function tile(ownerUserId) {
      let el = document.getElementById("tile-" + ownerUserId);
      if (!el) {
        el = document.createElement("div");
        el.className = "tile";
        el.id = "tile-" + ownerUserId;
        el.innerHTML = `<p>${ownerUserId}</p><video autoplay playsinline></video>`;
        document.getElementById("videos").appendChild(el);
      }
      return el.querySelector("video");
    }

    document.getElementById("join").addEventListener("click", async () => {
      const name = document.getElementById("name").value || "Prueba";
      const mod = document.getElementById("mod").value || "";
      log("conectando...");
      const welcome = await connect(userId, name, mod, (a, t) => log(`reintentando conexion ${a}/${t}`));
      log("conectado, isModerator=", welcome.isModerator);

      sfu = createSfuManager({
        userId,
        onRemoteStream: (ownerUserId, stream, ownerName) => {
          log("onRemoteStream de", ownerUserId, ownerName);
          const v = tile(ownerUserId);
          v.srcObject = stream;
          // Safari/iOS puede bloquear el autoplay si el elemento se crea
          // despues de que el "gesto" del usuario (el click en Entrar) ya
          // "vencio" por los await de por medio -- se fuerza el play()
          // explicito para no depender de que autoplay alcance solo. La
          // app real (paso 7) va a rutear el audio por Web Audio API en vez
          // de esto, como ya hace con los tiles de la sala (mas confiable).
          v.play().catch((err) => log("no se pudo reproducir solo, hace falta un click en la pagina:", err.message));
        },
        onRemoveStream: (ownerUserId) => {
          log("onRemoveStream de", ownerUserId);
          document.getElementById("tile-" + ownerUserId)?.remove();
        },
        onModeratorExtraStream: (ownerUserId, stream) => {
          log("onModeratorExtraStream (solo mod) de", ownerUserId);
          tile(ownerUserId + "-extra").srcObject = stream;
        },
      });

      await sfu.getExistingProducers();
      log("puesto al dia con producers existentes");
    });

    let localStream = null;
    let micMuted = false;
    let camMuted = false;

    document.getElementById("cam").addEventListener("click", async () => {
      if (!sfu) return log("primero entra a la sala");
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      const selfVideo = tile(userId);
      selfVideo.srcObject = localStream; // vista propia, no pasa por el SFU
      selfVideo.muted = true; // si no, cada uno escucha su propio mic de vuelta (eco)
      const videoTrack = localStream.getVideoTracks()[0];
      const audioTrack = localStream.getAudioTracks()[0];
      if (videoTrack) await sfu.produceTrack("camera", videoTrack);
      if (audioTrack) await sfu.produceTrack("mic", audioTrack);
      log("camara+mic mandados");
    });

    document.getElementById("mute-mic").addEventListener("click", () => {
      if (!sfu) return log("primero entra a la sala");
      micMuted = !micMuted;
      sfu.setMute("mic", micMuted);
      log("mic muted =", micMuted, "(revisa en la OTRA pestaña si se corta/vuelve el audio)");
    });

    document.getElementById("mute-cam").addEventListener("click", () => {
      if (!sfu) return log("primero entra a la sala");
      camMuted = !camMuted;
      sfu.setMute("camera", camMuted);
      log("camera muted =", camMuted, "(revisa en la OTRA pestaña si se corta/vuelve el video)");
    });

    document.getElementById("mod-camera").addEventListener("click", async () => {
      if (!sfu || !localStream) return log("primero entra a la sala y prende la camara");
      const videoTrack = localStream.getVideoTracks()[0];
      if (!videoTrack) return log("no hay video para mandar");
      await sfu.sendCameraToModerators(videoTrack.clone());
      log('modCamera mandado -- solo deberia verse en una pestana que entro CON la clave de moderador');
    });
  </script>
</body>
</html>
